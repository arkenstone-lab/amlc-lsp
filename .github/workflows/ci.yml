name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-opam:
    name: Native opam build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          opam-local-packages: amlc-lsp.opam
      - name: Validate package metadata
        run: |
          opam lint amlc-lsp.opam
          sh scripts/check-versions
      - name: Install package
        run: opam install . --with-test -y
      - name: Build and test
        run: opam exec -- dune runtest

  windows-opam:
    name: Windows opam build and test (${{ matrix.windows_environment }})
    strategy:
      fail-fast: false
      matrix:
        windows_environment: [cygwin, msys2]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          opam-local-packages: amlc-lsp.opam
          windows-environment: ${{ matrix.windows_environment }}
      - name: Validate package metadata
        run: opam lint amlc-lsp.opam
      - name: Install package
        run: opam install . --with-test -y
      - name: Build and test
        run: opam exec -- dune runtest

  nix:
    name: Reproducible Nix build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Build package
        run: nix build .#
      - name: Run tests
        run: nix develop --command dune runtest
      - name: Run Neovim smoke test
        run: nix develop --command dune build @neovim-smoke
      - name: Validate Tree-sitter grammar
        run: nix develop --command sh test/tree-sitter-fixtures.sh
      - name: Validate pinned Zed grammar and highlights
        run: nix develop --command sh test/zed-grammar-pin.sh
      - name: Validate compiler contracts
        run: nix develop --command sh test/compiler-contract.sh
