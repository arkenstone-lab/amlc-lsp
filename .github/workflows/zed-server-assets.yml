name: Zed server assets

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
      - name: Check out immutable server source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: release-source
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          opam-pin: false
          windows-compiler: mingw
          windows-environment: msys2
      - name: Prepare the official Windows GMP package
        if: runner.os == 'Windows'
        shell: 'C:\msys64\usr\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
        run: |
          curl --fail --location --retry 3 \
            --output mingw-w64-x86_64-gmp-6.3.0-2-any.pkg.tar.zst \
            https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-gmp-6.3.0-2-any.pkg.tar.zst
          curl --fail --location --retry 3 \
            --output mingw-w64-gmp-6.3.0-2.src.tar.zst \
            https://mirror.msys2.org/mingw/sources/mingw-w64-gmp-6.3.0-2.src.tar.zst
          echo "8924433974c4add46cb46ea4f6ef283b5c5139d3f552375115b5580f855015cc  mingw-w64-x86_64-gmp-6.3.0-2-any.pkg.tar.zst" | sha256sum --check
          echo "f288f944fd9609db220bcf6a8dd0703a5674eeb906ef35eb8485bb8192135994  mingw-w64-gmp-6.3.0-2.src.tar.zst" | sha256sum --check
          /usr/bin/pacman.exe -U --noconfirm --needed mingw-w64-x86_64-gmp-6.3.0-2-any.pkg.tar.zst
          test "$(/usr/bin/pacman.exe -Q mingw-w64-x86_64-gmp | awk '{ print $2 }' | tr -d '\r')" = "6.3.0-2"
          {
            echo "GMP_PREFIX=C:/msys64/mingw64"
            echo "GMP_SOURCE=$PWD/mingw-w64-gmp-6.3.0-2.src.tar.zst"
          } >> "$GITHUB_ENV"
      - name: Validate immutable source version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(git -C release-source describe --tags --exact-match)" = "$RELEASE_TAG"
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' release-source/amlc-lsp.opam)
          test "v$version" = "$RELEASE_TAG"
      - name: Build the redistributable GMP library
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/build-zed-gmp
      - name: Install the tagged server against bundled GMP
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$GMP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$GMP_PREFIX/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          opam install -y zarith.1.14 yojson.3.0.0 base64.3.5.2 digestif.1.3.0
          opam install ./release-source --with-test -y
      - name: Package and test the server in its final layout
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p _build/release-licenses
          curl --fail --location --retry 3 \
            --output _build/release-licenses/OCaml-LICENSE \
            https://raw.githubusercontent.com/ocaml/ocaml/4.14.2/LICENSE
          curl --fail --location --retry 3 \
            --output _build/release-licenses/Zarith-LICENSE \
            https://raw.githubusercontent.com/ocaml/Zarith/release-1.14/LICENSE
          export THIRD_PARTY_LICENSES="$PWD/_build/release-licenses"
          version=$RELEASE_TAG
          version=${version#v}
          server="$(opam var bin)/amlc-lsp"
          case "$RUNNER_OS" in
            Windows)
              server="${server}.exe"
              export GMP_LIBRARY="$GMP_PREFIX/bin/libgmp-10.dll"
              ;;
          esac
          package_log=_build/package-zed-server.log
          scripts/package-zed-server "$version" "${{ matrix.target }}" \
            "$server" "$GMP_SOURCE" > "$package_log"
          cat "$package_log"
          asset=$(tail -1 "$package_log")
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Preserve release asset for inspection
        uses: actions/upload-artifact@v4
        with:
          name: amlc-lsp-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
